name: Build XerezTap Panel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android
        uses: android-actions/setup-android@v3

      - name: Descomprimir proyecto del panel
        run: |
          unzip -q XerezTap_Panel_Control_V1.zip -d panel_source
          echo "===== ARCHIVOS DEL PROYECTO ====="
          find panel_source -maxdepth 4 -type f | sort

      - name: Corregir configuración de compilación
        working-directory: panel_source
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle.kts")
          text = p.read_text()

          # ==========================================
          # JAVA 17
          # ==========================================

          if "sourceCompatibility = JavaVersion.VERSION_17" not in text:

              text = text.replace(
                  "android {",
                  """android {

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          """,
                  1
              )

          # ==========================================
          # MATERIAL 3 EXPERIMENTAL API
          # ==========================================

          if "ExperimentalMaterial3Api" not in text:

              text += """

          // Permitir APIs experimentales de Material 3
          tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompilationTask<*>>().configureEach {
              compilerOptions {
                  optIn.add("androidx.compose.material3.ExperimentalMaterial3Api")
              }
          }
          """

          p.write_text(text)

          print("")
          print("==========================================")
          print(" build.gradle.kts FINAL")
          print("==========================================")
          print(p.read_text())
          print("==========================================")
          PY

      - name: Instalar Gradle 8.9
        run: |
          curl -L -o gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle.zip

          echo "===== GRADLE INSTALADO ====="
          ./gradle-8.9/bin/gradle --version

      - name: Compilar APK
        working-directory: panel_source
        run: |
          ../gradle-8.9/bin/gradle assembleDebug --no-daemon --stacktrace

      - name: Comprobar APK generado
        run: |
          echo "===== BUSCANDO APK ====="
          find panel_source -type f -name "*.apk" -print

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: XerezTap-Panel-APK
          path: panel_source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
