name: Build XerezTap Panel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android
        uses: android-actions/setup-android@v3

      - name: Descomprimir proyecto
        run: |
          unzip -q XerezTap_Panel_FINAL_LOGIN_QR_CORREGIDO.zip -d panel_source
          test -f panel_source/settings.gradle.kts
          test -f panel_source/app/build.gradle.kts
          test -f panel_source/app/src/main/java/com/xereztap/panel/MainActivity.kt
          echo "Proyecto correcto"

      - name: Configurar compilación
        working-directory: panel_source
        run: |
          sed -i '/android {/a\    compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }' app/build.gradle.kts
          sed -i '/android {/a\    kotlinOptions { jvmTarget = "17" }' app/build.gradle.kts
          sed -i '/^@Composable fun App()/i @OptIn(ExperimentalMaterial3Api::class)' app/src/main/java/com/xereztap/panel/MainActivity.kt
          echo "Configuración aplicada"

      - name: Configurar conexión HTTP
        working-directory: panel_source
        run: |
          sed -i 's#https://xereztap.myartsonline.com/api.php#http://xereztap.myartsonline.com/api.php#g' $(find app/src/main -name MainActivity.kt)
          sed -i 's#<application#<application android:usesCleartextTraffic="true"#' $(find app/src/main -name AndroidManifest.xml)
          echo "Conexión HTTP configurada"

      - name: Instalar Gradle 8.9
        run: |
          curl -L -o gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle.zip
          ./gradle-8.9/bin/gradle --version

      - name: Compilar APK
        working-directory: panel_source
        run: |
          ../gradle-8.9/bin/gradle assembleDebug --no-daemon --stacktrace

      - name: Comprobar APK generado
        run: |
          test -f panel_source/app/build/outputs/apk/debug/app-debug.apk
          ls -lh panel_source/app/build/outputs/apk/debug/app-debug.apk

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: XerezTap-Panel-APK
          path: panel_source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
