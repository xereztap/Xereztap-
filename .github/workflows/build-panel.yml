name: Build XerezTap Panel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android
        uses: android-actions/setup-android@v3

      - name: Descomprimir proyecto del panel
        run: |
          unzip -q XerezTap_Panel_Control_V1.zip -d panel_source

          echo "===== ARCHIVOS ====="
          find panel_source -maxdepth 5 -type f | sort

      - name: Configurar compilación y conexión
        working-directory: panel_source
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # ------------------------------------------
          # GRADLE
          # ------------------------------------------
          p = Path("app/build.gradle.kts")
          text = p.read_text()

          if "sourceCompatibility = JavaVersion.VERSION_17" not in text:
              text = text.replace(
                  "android {",
                  """android {

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          """,
                  1
              )

          if "ExperimentalMaterial3Api" not in text:
              text += """

          tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompilationTask<*>>().configureEach {
              compilerOptions {
                  optIn.add("androidx.compose.material3.ExperimentalMaterial3Api")
              }
          }
          """

          p.write_text(text)

          # ------------------------------------------
          # BUSCAR MAINACTIVITY
          # ------------------------------------------
          main_files = list(Path("app/src/main").rglob("MainActivity.kt"))

          if not main_files:
              raise SystemExit("ERROR: No se encontró MainActivity.kt")

          main = main_files[0
